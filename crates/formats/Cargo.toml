[package]
name = "qa-formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["miniz_oxide"] }
png = "0.18.1"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
gif = "0.14.2"
lewton = { version = "0.10.2", default-features = false }
qa-core = { path = "../core" }
qa-platform = { path = "../platform" }

[dev-dependencies]
lewton = { version = "0.10.2", features = ["ogg"] }
ogg = "0.8.0"
