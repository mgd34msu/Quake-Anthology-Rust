[package]
name = "qa-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
proof = ["qa-platform/proof", "allocation-tracking"]
allocation-tracking = ["qa-platform/allocation-tracking", "qa-console/lookup-tracking"]

[dependencies]
qa-core = { path = "../core" }
qa-audio = { path = "../audio" }
qa-compat = { path = "../compat" }
qa-platform = { path = "../platform" }
qa-console = { path = "../console" }
qa-content = { path = "../content" }
qa-input = { path = "../input" }
qa-movement = { path = "../movement" }
qa-network = { path = "../network" }
qa-session = { path = "../session" }
qa-world = { path = "../world" }
qa-formats = { path = "../formats" }
qa-gameplay = { path = "../gameplay" }
qa-ui = { path = "../ui" }
qa-render = { path = "../render" }
serde_json = "1"

[[bin]]
name = "qa-rust"
path = "src/main.rs"

[[test]]
name = "native_modules"
path = "tests/native_modules.rs"
harness = false

[[test]]
name = "module_signon"
path = "tests/module_signon.rs"
harness = false

[[test]]
name = "client_commands"
path = "tests/client_commands.rs"
harness = false

[[test]]
name = "client_snapshots"
path = "tests/client_snapshots.rs"
harness = false

[[test]]
name = "client_loops"
path = "tests/client_loops.rs"
harness = false

[[test]]
name = "cgame_restart"
path = "tests/cgame_restart.rs"
harness = false
