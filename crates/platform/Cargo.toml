[package]
name = "qa-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
proof = []
allocation-tracking = ["qa-console/lookup-tracking"]

[dependencies]
qa-core = { path = "../core" }

[dev-dependencies]
qa-input = { path = "../input" }
qa-network = { path = "../network" }
qa-app = { path = "../app" }
qa-console = { path = "../console" }
qa-session = { path = "../session" }
qa-movement = { path = "../movement" }
qa-world = { path = "../world" }
qa-render = { path = "../render" }
qa-content = { path = "../content" }
qa-formats = { path = "../formats" }

[[example]]
name = "output_retirement"
required-features = ["allocation-tracking"]

[[example]]
name = "name_consumers"
required-features = ["allocation-tracking"]

[[example]]
name = "body_attachments"
required-features = ["allocation-tracking"]

[[example]]
name = "think_dispatch"
required-features = ["allocation-tracking"]
